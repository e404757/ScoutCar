# web_node 参数
# 订阅面：感知相机推流 = debug_image（感知同帧合成的叠加画面，掩膜/边界零时差）；
#         其它相机推流 = 原始帧；launch 里可覆盖
web_node:
  ros__parameters:
    port: 8080
    
    # 录像：一个按钮起停；每段同步录 原始.avi + 叠加_mask.avi（帧号对齐）。
    # 片段留在 record_dir；回放/补标导出在 Windows 标注平台进行。
    record_dir: /home/orangepi/CityScout/data/record
    # 0=按实际感知帧率建档，避免处理只有约 20 FPS 时按 30 FPS 加速播放。
    record_fps: 0
    # 同一个网页按钮同时录制双 AVI 与轻量 rosbag。
    bag_dir: /home/orangepi/CityScout/data/bags
    bag_topics:
      - /perception/road_deviation
      - /mission/mission_state
      - /mission/base_cmd
      - /mission/path_cmd
      - /mission/detect_task
      - /perception/recon_result
      - /mcu/rx_event
      - /obstacle/event
    jpg_quality: 85
