mipi_camera_node:
  ros__parameters:
    camera_path: "/dev/video11"
    fps: 30
    image_width: 640
    image_height: 480
    image_topic: "/camera/mipi/image_raw"
    prefer_mipi: true

usb_camera_node:
  ros__parameters:
    camera_path: "/dev/v4l/by-id/usb-Generic_USB_Camera_200901010001-video-index0"
    fps: 30
    image_width: 640
    image_height: 480
    image_topic: "/camera/usb/image_raw"
    prefer_mipi: false

perception_node:
  ros__parameters:
    image_topic: "/camera/usb/image_raw"
    preview.near.row_ratio: 0.80
    preview.near.edge_margin_px: 10
    # 最新 crossroad_mask_03 的当前相机尺度。
    preview.near.min_width: 384
    preview.near.max_width: 450
    preview.far.row_ratio: 0.40
    preview.far.edge_margin_px: 10
    # 当前 Mask 的远处透视尺度。
    preview.far.min_width: 208
    preview.far.max_width: 268
    road_tracking.max_inline_gap_px: 8
    road_tracking.min_run_width_px: 12
    road_tracking.overlap_margin_px: 14
    road_tracking.max_missing_rows: 6
    road_tracking.bottom_seed_ratio: 0.85
    road_tracking.use_barrier_gap: true

mission_node:
  ros__parameters:
    turn_penalty: 0.5
    u_turn_penalty: 1.0
    tunnel_risk: 0.0
    recon_target: 8
    obstacle_mode: "bidirectional"

serial_node:
  ros__parameters:
    serial_device: "/dev/ttyS6"
    deviation_rate_hz: 30.0
    deviation_timeout_ms: 150
    baud_rate: 115200
