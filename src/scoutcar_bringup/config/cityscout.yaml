mipi_camera_node:
  ros__parameters:
    camera_path: "/dev/video11"
    fps: 30
    image_width: 640
    image_height: 480
    image_topic: "/camera/mipi/image_raw"
    prefer_mipi: true

usb_camera_node:
  ros__parameters:
    camera_path: "/dev/v4l/by-id/usb-Generic_USB_Camera_200901010001-video-index0"
    fps: 30
    image_width: 640
    image_height: 480
    image_topic: "/camera/usb/image_raw"
    prefer_mipi: false

perception_node:
  ros__parameters:
    usb_image_topic: "/camera/usb/image_raw"
    mipi_image_topic: "/camera/mipi/image_raw"
    ipm.mipi_source_points: [219.0, 190.0, 412.0, 190.0, 65.0, 440.0, 559.0, 440.0]
    ipm.usb_source_points: [255.0, 240.0, 489.0, 240.0, 207.0, 440.0, 627.0, 440.0]
    ipm.destination_points: [180.0, 120.0, 460.0, 120.0, 180.0, 470.0, 460.0, 470.0]
    # 以下宽度和偏差都在 640x480 俯视图中，近处和远处使用同一尺度。
    road_tracking.scan_end_y: 120
    road_tracking.min_road_width_px: 225
    road_tracking.max_road_width_px: 285
    road_tracking.min_barrier_width_px: 12
    road_tracking.search_expand_px: 20
    road_tracking.min_valid_rows: 60

visualizer_node:
  ros__parameters:
    ipm.mipi_source_points: [219.0, 190.0, 412.0, 190.0, 65.0, 440.0, 559.0, 440.0]
    ipm.usb_source_points: [255.0, 240.0, 489.0, 240.0, 207.0, 440.0, 627.0, 440.0]
    ipm.destination_points: [180.0, 120.0, 460.0, 120.0, 180.0, 470.0, 460.0, 470.0]

mission_node:
  ros__parameters:
    turn_penalty: 0.5
    u_turn_penalty: 1.0
    tunnel_risk: 0.0
    obstacle_mode: "bidirectional"

serial_node:
  ros__parameters:
    serial_device: "/dev/ttyS6"
    deviation_rate_hz: 30.0
    deviation_timeout_ms: 150
    baud_rate: 115200
